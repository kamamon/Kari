<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title description">
  <title id="title">灯継ぎの里｜南北の高低差</title>
  <desc id="description">完成済みの hub_section_v1.png をもとに再構成した編集可能なベクター図。同じ設計意図を示すが、失われたSVG原本の同一バイト復元ではない。中央広場を相対標高0mとし、南から-10m、-3m、0m、+8m、+22mの五段。縦方向は12px/mで統一、人物の基準高は1.75m。横方向の距離と各段を結ぶ斜線は模式表現で、階段・坂の施工形状ではない。設計提案・未実装。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK JP', sans-serif; fill: #293d3a; }
      .muted { fill: #6e7b70; }
      .accent { fill: #a47745; }
      .bold { font-weight: 700; }
      .guide { stroke: #b7c8b7; stroke-width: 1.6; stroke-dasharray: 6 8; }
      .outline { stroke: #293d3a; stroke-width: 2; stroke-linejoin: round; }
      .floor { stroke: #293d3a; stroke-width: 4; fill: none; }
    </style>
    <pattern id="rock-hatch" width="55" height="38" patternUnits="userSpaceOnUse">
      <path d="M1 26 L54 18 M11 13 L19 34" fill="none" stroke="#9ba58f" stroke-width="1" opacity="0.34"/>
    </pattern>
    <path id="ground-shape" d="M130 820 H421 L470 736 H674 L732 700 H1014 L1074 604 H1305 L1360 436 H1632 L1680 850 H130 Z"/>
    <clipPath id="ground-clip"><use xlink:href="#ground-shape"/></clipPath>
    <symbol id="person-1p75m" viewBox="0 0 12 21">
      <circle cx="6" cy="3" r="2" fill="#293d3a"/>
      <path d="M6 5 V13 M2 9 H10 M6 13 L2 21 M6 13 L10 21" fill="none" stroke="#293d3a" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="1800" height="1180" fill="#f3f0e7"/>
  <g id="heading">
    <text x="72" y="64" font-size="18" class="accent bold">VEILBOUND HUNTERS / HUB DESIGN 02</text>
    <text x="72" y="116" font-size="42" class="bold">灯継ぎの里｜南北の高低差</text>
    <text x="73" y="158" font-size="22" class="muted">谷の水音から、炉と生活の音を経て、風が通る灯見の台へ</text>
    <path d="M72 184 H1728" stroke="#c6cbbd" stroke-width="2"/>
  </g>

  <rect x="72" y="212" width="1656" height="685" rx="26" fill="#e9ece1"/>
  <g id="elevation-guides" font-size="22" class="bold">
    <path d="M116 436 H1665" class="guide"/><text x="100" y="443" text-anchor="end" class="muted">+22m</text>
    <path d="M116 604 H1665" class="guide"/><text x="100" y="611" text-anchor="end" class="muted">+8m</text>
    <path d="M116 700 H1665" class="guide"/><text x="100" y="707" text-anchor="end" class="muted">0m</text>
    <path d="M116 736 H1665" class="guide"/><text x="100" y="743" text-anchor="end" class="muted">-3m</text>
    <path d="M116 820 H1665" class="guide"/><text x="100" y="827" text-anchor="end" class="muted">-10m</text>
  </g>

  <g id="terrain" aria-label="横方向は模式、縦方向は12px/m">
    <use xlink:href="#ground-shape" fill="#c8cbb8" stroke="#899b89" stroke-width="3" stroke-linejoin="round"/>
    <rect x="130" y="436" width="1550" height="414" fill="url(#rock-hatch)" clip-path="url(#ground-clip)"/>
    <path d="M132 829 H248" stroke="#86b5b5" stroke-width="8"/>
    <rect x="470" y="736" width="204" height="12" fill="#d4c29c"/>
    <rect x="732" y="700" width="282" height="12" fill="#e0d8b1"/>
    <path d="M130 820 H421 M470 736 H674 M732 700 H1014 M1074 604 H1305 M1360 436 H1632" class="floor"/>
  </g>

  <g id="level-water" data-elevation-m="-10" data-floor-y="820">
    <text x="265" y="667" font-size="28" text-anchor="middle" class="bold">水音の庭</text>
    <text x="265" y="702" font-size="25" text-anchor="middle" class="accent bold">-10m</text>
    <rect x="252" y="764" width="86" height="56" fill="#aa9a77" class="outline"/>
    <path d="M242 764 L295 743 L348 764 Z" fill="#b9b59a" class="outline"/>
    <path d="M269 764 V820 M321 764 V820" stroke="#48534a" stroke-width="4"/>
    <rect x="285" y="786" width="20" height="34" fill="#535244"/>
    <g id="waterwheel" fill="none" stroke="#8d754d">
      <circle cx="190" cy="797" r="26" stroke-width="4"/>
      <path d="M164 797 H216 M190 771 V823 M172 779 L208 815 M172 815 L208 779" stroke-width="3"/>
    </g>
    <use xlink:href="#person-1p75m" x="364" y="799" width="12" height="21"/>
  </g>

  <g id="level-forge" data-elevation-m="-3" data-floor-y="736">
    <text x="564" y="531" font-size="28" text-anchor="middle" class="bold">炉の段</text>
    <text x="564" y="566" font-size="25" text-anchor="middle" class="accent bold">-3m</text>
    <rect x="505" y="672" width="102" height="64" fill="#aa9a77" class="outline"/>
    <path d="M495 672 L556 649 L617 672 Z" fill="#b9b59a" class="outline"/>
    <path d="M525 672 V736 M587 672 V736" stroke="#48534a" stroke-width="4"/>
    <rect x="545" y="696" width="22" height="40" fill="#535244"/>
    <rect x="578" y="635" width="16" height="51" rx="1" fill="#8c9485" class="outline"/>
    <path d="M585 631 C570 612 599 602 582 579" fill="none" stroke="#a7b0a1" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
    <use xlink:href="#person-1p75m" x="639" y="715" width="12" height="21"/>
  </g>

  <g id="level-plaza" data-elevation-m="0" data-floor-y="700">
    <text x="874" y="507" font-size="28" text-anchor="middle" class="bold">灯の広場</text>
    <text x="874" y="542" font-size="25" text-anchor="middle" class="accent bold">0m</text>
    <rect x="790" y="650" width="84" height="50" fill="#aa9a77" class="outline"/>
    <path d="M780 650 L832 630 L884 650 Z" fill="#b9b59a" class="outline"/>
    <path d="M807 650 V700 M857 650 V700" stroke="#48534a" stroke-width="4"/>
    <rect x="823" y="669" width="18" height="31" fill="#535244"/>
    <rect x="918" y="655" width="70" height="45" fill="#aa9a77" class="outline"/>
    <path d="M908 655 L953 638 L998 655 Z" fill="#b9b59a" class="outline"/>
    <path d="M932 655 V700 M974 655 V700" stroke="#48534a" stroke-width="4"/>
    <rect x="945" y="672" width="16" height="28" fill="#535244"/>
    <use xlink:href="#person-1p75m" x="892" y="679" width="12" height="21"/>
  </g>

  <g id="level-living" data-elevation-m="8" data-floor-y="604">
    <text x="1190" y="415" font-size="28" text-anchor="middle" class="bold">暮らしの段</text>
    <text x="1190" y="450" font-size="25" text-anchor="middle" class="accent bold">+8m</text>
    <rect x="1122" y="528" width="119" height="76" fill="#aa9a77" class="outline"/>
    <path d="M1112 528 L1181 501 L1251 528 Z" fill="#b9b59a" class="outline"/>
    <path d="M1145 528 V604 M1217 528 V604" stroke="#48534a" stroke-width="4"/>
    <rect x="1168" y="557" width="26" height="47" fill="#535244"/>
    <use xlink:href="#person-1p75m" x="1274" y="583" width="12" height="21"/>
  </g>

  <g id="level-lookout" data-elevation-m="22" data-floor-y="436">
    <text x="1450" y="255" font-size="28" text-anchor="middle" class="bold">灯見の台</text>
    <text x="1450" y="290" font-size="25" text-anchor="middle" class="accent bold">+22m</text>
    <rect x="1388" y="361" width="130" height="75" fill="#aa9a77" class="outline"/>
    <path d="M1378 361 L1453 332 L1528 361 Z" fill="#b9b59a" class="outline"/>
    <path d="M1414 361 V436 M1492 361 V436" stroke="#48534a" stroke-width="4"/>
    <rect x="1439" y="389" width="28" height="47" fill="#535244"/>
    <path d="M1580 345 V436" stroke="#9b784d" stroke-width="9"/>
    <rect x="1565" y="305" width="30" height="40" rx="3" fill="#ecc373" stroke="#293d3a" stroke-width="3"/>
    <path d="M1561 307 L1580 292 L1599 307 Z" fill="#293d3a"/>
    <use xlink:href="#person-1p75m" x="1534" y="415" width="12" height="21"/>
  </g>

  <g id="view-connection">
    <path d="M912 409 C1120 360 1341 354 1533 407" fill="none" stroke="#8aa38b" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round"/>
    <text x="1053" y="322" font-size="21" class="muted">上の道から、下の屋根と灯を見下ろす</text>
  </g>

  <g id="height-dimension" data-span-m="32">
    <path d="M1665 436 V820 M1653 436 H1677 M1653 820 H1677" fill="none" stroke="#a47745" stroke-width="3"/>
    <rect x="1598" y="605" width="112" height="64" rx="10" fill="#fcfaf5"/>
    <text x="1654" y="633" text-anchor="middle" font-size="21" class="accent bold">高低差</text>
    <text x="1654" y="658" text-anchor="middle" font-size="25" class="accent bold">32m</text>
  </g>
  <text x="130" y="879" font-size="22" class="bold">南・谷側</text>
  <text x="1632" y="879" text-anchor="end" font-size="22" class="bold">北・山側</text>

  <g id="design-notes">
    <rect x="72" y="922" width="455" height="171" rx="17" fill="#fcfaf5"/>
    <text x="94" y="963" font-size="25" class="bold">準備は中段で完結</text>
    <text x="94" y="1000" font-size="20" class="muted">依頼板・商店・装備箱：0m</text>
    <text x="94" y="1031" font-size="20" class="muted">工房：-3mの隣接段</text>
    <text x="94" y="1062" font-size="20" class="muted">全施設の「一覧」アクセスを維持</text>

    <rect x="552" y="922" width="455" height="171" rx="17" fill="#fcfaf5"/>
    <text x="574" y="963" font-size="25" class="bold">歩くための寸法案</text>
    <text x="574" y="1000" font-size="20" class="muted">主要道：幅3.5〜4m</text>
    <text x="574" y="1031" font-size="20" class="muted">階段：幅2.5〜3m／踊り場4.5m</text>
    <text x="574" y="1062" font-size="20" class="muted">橋：約2.8m／上下の歩行はP2案</text>

    <rect x="1033" y="922" width="695" height="171" rx="17" fill="#fcfaf5"/>
    <text x="1055" y="963" font-size="25" class="bold">坂と階段は平面方向にも折り返す</text>
    <text x="1055" y="1000" font-size="20" class="muted">人の基準高：1.75m。高さのみ縮尺を統一。</text>
    <text x="1055" y="1031" font-size="20" class="muted">各施設を同じ断面へ投影。水平距離は模式表現。</text>
    <text x="1055" y="1062" font-size="20" class="muted">段の接続形状・橋の上下判定・カメラは実装時に検証。</text>
  </g>

  <text x="73" y="1137" font-size="20" class="muted">設計提案・未実装。新施設名は仮称。概念配置／距離は試作で調整。採用済み原画の石・木・布・青銅の質感を継承。</text>
</svg>
