<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">灯継ぎの里 — 五段の俯瞰配置</title>
  <desc id="desc">完成済みPNG配置図から編集用に再構成したベクター図。設計相対標高は水音の庭マイナス10m、炉の段マイナス3m、灯の広場0m、暮らしの段プラス8m、灯見の台プラス22m。最大高低差32m。距離と接続形状は概念で未実装。旧SVGの同一バイト復元ではない。</desc>
