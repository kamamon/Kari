    ];
    const hairs = [
      ["H01","Aの無造作な短髪"],["H02","直毛の短い刈り込み"],["H03","直毛の横分け短髪"],["H04","直毛の耳丈ボブ"],
      ["H05","直毛の低い結び髪"],["H06","波状の後ろ流し短髪"],["H07","波状の耳かけ短髪"],["H08","波状の低い結び髪"],
      ["H09","巻き毛の短髪"],["H10","巻き毛の短いボブ"],["H11","巻き毛の低い結び髪"],["H12","巻き毛の高いまとめ髪"],
      ["H13","強いカールの短い刈り込み"],["H14","強いカールの丸い短髪"],["H15","頭に沿わせた編み髪"],["H16","短いツイストのまとめ髪"]
    ];
    const bodies = [["B01","細身",30,35],["B02","標準",50,50],["B03","筋肉質",85,30],["B04","ふくよか",40,80]];
    const presets = [
      {id:"P01",title:"基準ハンターA",note:"採用Aの概形",skin:"legacyA",hair:"H01",color:"C02",body:"legacyA",muscle:50,softness:50},
      {id:"P02",title:"女性的・標準",note:"落ち着いた印象",skin:"S04",hair:"H07",color:"C03",body:"B02",muscle:50,softness:50},
      {id:"P03",title:"男性的・筋肉質",note:"力のある体つき",skin:"S10",hair:"H13",color:"C01",body:"B03",muscle:85,softness:30},
      {id:"P04",title:"女性的・ふくよか",note:"自然な丸み",skin:"S08",hair:"H11",color:"C05",body:"B04",muscle:40,softness:80},
      {id:"P05",title:"中性的・細身",note:"すっきりした輪郭",skin:"S02",hair:"H03",color:"C06",body:"B01",muscle:30,softness:35},
      {id:"P06",title:"中性的・標準",note:"柔らかな輪郭",skin:"S12",hair:"H15",color:"C01",body:"B02",muscle:50,softness:50}
    ];
    const stateFrom = (p) => ({source:p.id,skin:p.skin,hair:p.hair,color:p.color,body:p.body,muscle:p.muscle,softness:p.softness});
    let draft = stateFrom(presets[1]);
    let start = copy(draft);
    let undo = [], redo = [], gesture = null, pointerGesture = false, comparison = false, confirmMode = null;
    const getSkin = (s) => skins.find((v)=>v[0]===s.skin) || ["legacyA","採用A（参考色）","#B98A6C"];
    const getHair = (s) => hairs.find((v)=>v[0]===s.hair);
    const getColor = (s) => colors.find((v)=>v[0]===s.color);
    const getBody = (s) => bodies.find((v)=>v[0]===s.body) || ["legacyA","採用A（概形）",50,50];
    const say = (text) => {find("[data-status]").textContent=text;};
    const push = (previous) => {undo.push(copy(previous)); if(undo.length>50) undo.shift(); redo=[];};
    function finishGesture() {
      if (gesture && !equal(gesture,draft)) push(gesture);
      gesture = null;
      pointerGesture = false;
      sync();
    }
    function cancelGesture() {
      if (!gesture) return;
      draft=copy(gesture);gesture=null;pointerGesture=false;comparison=false;sync();
      say("調整を中断し、ドラッグ開始時の値へ戻しました。");
    }
    function change(next,message) {
      finishGesture();
      if (!equal(draft,next)) {push(draft);draft=copy(next);}
      comparison=false;sync();if(message)say(message);
    }
    function setAttr(q,name,value) {find(q).setAttribute(name,String(value));}
    function circle(cx,cy,r) {return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"></circle>';}
    function hairShape(id) {
      let back="",front="";
      const cap='<path d="M102 60 Q99 28 130 27 Q161 28 158 62 L150 47 Q130 42 110 48Z"></path>';
      const lowTail='<path d="M151 73 Q174 81 164 118 Q161 129 156 132 Q163 105 149 95Z"></path>';
      if(id==="H01") front='<path d="M101 66 L98 46 L105 47 L108 33 L117 37 L126 24 L131 33 L145 28 L146 36 L159 39 L157 62 L150 48 L139 45 L133 54 L126 43 L113 52 L106 67Z"></path>';
      else if(id==="H02") front='<path d="M102 59 Q100 31 130 30 Q160 31 158 59 L153 47 Q130 40 107 47Z"></path>';
      else if(id==="H03") front='<path d="M100 65 Q98 29 131 26 Q165 26 158 65 L153 48 L144 37 Q125 54 108 57 L104 68Z"></path>';
      else if(id==="H04") {back='<path d="M98 47 Q100 25 130 25 Q161 25 162 49 L165 93 L148 98 L107 98 L95 93Z"></path>';front='<path d="M101 55 Q103 30 130 29 Q155 29 159 54 L136 46 L129 36 L121 52 L102 59Z"></path>';}
      else if(id==="H05") {back=lowTail;front=cap;}
      else if(id==="H06") front='<path d="M101 61 Q96 46 104 36 Q102 24 120 28 Q123 18 136 26 Q155 21 159 36 Q169 43 158 64 L150 47 Q127 43 107 56Z"></path>';
      else if(id==="H07") {back='<path d="M103 42 Q93 60 101 90 L108 86 L110 51Z M151 42 Q168 61 158 88 L151 85 L149 51Z"></path>';front='<path d="M101 60 Q98 29 132 28 Q165 30 160 64 L151 51 Q140 47 135 37 Q130 52 112 54 L106 65Z"></path>';}
      else if(id==="H08") {back=lowTail+circle(161,91,10)+circle(164,106,8);front='<path d="M101 61 Q96 43 110 35 Q117 22 133 29 Q157 22 161 42 L157 64 L149 47 Q131 37 109 57Z"></path>';}
      else if(["H09","H10","H11","H12","H13","H14"].includes(id)) {
        const radius=id==="H13"?6:id==="H14"?11:8;
        const reach=id==="H14"?30:id==="H13"?22:25;
        for(let i=0;i<9;i++){const a=Math.PI+(Math.PI*i/8);front+=circle(130+reach*Math.cos(a),54+22*Math.sin(a),radius);}
        front+='<path d="M105 51 Q130 35 155 51 L156 59 Q130 45 104 60Z"></path>';
        if(id==="H10"){for(let i=0;i<4;i++){back+=circle(103,55+i*11,9)+circle(158,55+i*11,9);}}
        if(id==="H11"){back=lowTail+circle(161,91,10)+circle(164,107,8);}
        if(id==="H12"){back=circle(130,24,15)+circle(119,22,8)+circle(143,22,8);}
        if(id==="H14")back=circle(130,52,37);
      } else if(id==="H15") {
        front=cap+'<g fill="none" stroke="var(--kc-bronze)" stroke-opacity=".45" stroke-width="2"><path d="M108 45 Q116 31 129 29 M116 47 Q126 32 136 30 M125 46 Q139 35 145 33 M138 46 Q150 38 152 40"></path></g>';
      } else {
        back=circle(155,83,12)+circle(158,96,8);
        front=cap+'<g fill="none" stroke="var(--kc-bronze)" stroke-opacity=".4" stroke-width="2"><path d="M108 48 Q105 35 117 34 M118 46 Q115 29 128 30 M129 45 Q129 29 141 33 M141 47 Q145 34 152 40"></path></g>';
      }
      return {back,front};
    }
    function draw(s) {
      const skin=getSkin(s),hair=getColor(s),shape=hairShape(s.hair);
      all("[data-skin]").forEach((el)=>el.setAttribute("fill",skin[2]));
      const hg=find("[data-hair-front]"),bg=find("[data-hair-back]");
      hg.innerHTML=shape.front;bg.innerHTML=shape.back;hg.setAttribute("fill",hair[2]);bg.setAttribute("fill",hair[2]);
      const base=s.body==="B01"?-6:s.body==="B03"?7:s.body==="B04"?10:0;
      const shoulder=33+base+(s.muscle-50)*.11;
      const belly=29+base*.8+(s.softness-50)*.13;
      const left=130-shoulder,right=130+shoulder,waistL=130-belly,waistR=130+belly;
      setAttr("[data-torso]","d","M"+left+" 113 Q130 102 "+right+" 113 L"+(right+6)+" 165 Q"+(waistR+3)+" 194 "+waistR+" 227 Q130 238 "+waistL+" 227 Q"+(waistL-3)+" 194 "+(left-6)+" 165Z");
      setAttr("[data-mantle]","d","M116 107 L"+(left-2)+" 111 Q"+(left-14)+" 115 "+(left-21)+" 140 L"+(left+10)+" 154 L117 125 L130 138 L143 125 L"+(right-10)+" 154 L"+(right+21)+" 140 Q"+(right+14)+" 115 "+(right+2)+" 111 L144 107 L144 115 Q130 128 116 115Z");
      setAttr("[data-left-arm]","d","M"+(left-8)+" 119 Q"+(left-24)+" 124 "+(left-27)+" 151 L63 204 L70 229 L83 229 L"+(left-6)+" 202 L"+(left+2)+" 149Z");
      setAttr("[data-right-arm]","d","M"+(right+8)+" 119 Q"+(right+24)+" 124 "+(right+27)+" 151 L197 204 L190 229 L177 229 L"+(right+6)+" 202 L"+(right-2)+" 149Z");
      setAttr("[data-belt]","d","M"+(waistL-1)+" 198 Q130 205 "+(waistR+1)+" 198 L"+(waistR+2)+" 211 Q130 219 "+(waistL-2)+" 211Z");
      setAttr("[data-straps]","d","M"+(left+7)+" 128 L"+waistR+" 195 L"+(waistR-6)+" 202 L"+(left+2)+" 134Z M"+(right-7)+" 128 L"+waistL+" 195 L"+(waistL+6)+" 202 L"+(right-2)+" 134Z");
      const pouchX=waistL-8;
      setAttr("[data-pouch]","d","M"+pouchX+" 213 L"+(pouchX+21)+" 213 L"+(pouchX+22)+" 239 Q"+(pouchX+10)+" 245 "+(pouchX-3)+" 239Z");
      setAttr("[data-pouch-flap]","d","M"+(pouchX-1)+" 214 L"+(pouchX+21)+" 214 L"+(pouchX+20)+" 225 L"+(pouchX-1)+" 225Z");
      const legShift=base*.45+(s.softness-50)*.035;
      setAttr("[data-legs]","d","M"+(99-legShift)+" 226 L125 225 L127 298 L123 352 L99 352 L"+(95-legShift)+" 298Z M135 225 L"+(162+legShift)+" 226 L"+(166+legShift)+" 298 L160 352 L136 352 L132 298Z");
      find("[data-summary]").textContent=getHair(s)[1]+" / "+getBody(s)[1];
      find("#kc-figure-title").textContent=(comparison?"編集前":"現在")+"の狩人の簡易輪郭";
      find("#kc-figure-desc").textContent=skin[1]+"、"+getHair(s)[1]+"、"+hair[1]+"、"+getBody(s)[1]+"。2Dの簡易表示で、完成3Dモデルではありません。";
    }
    function sync() {
      draw(comparison?start:draft);
      find("[data-view-name]").textContent=comparison?"編集前":"現在";
      all("[data-compare]").forEach((b)=>b.setAttribute("aria-pressed",String((b.dataset.compare==="before")===comparison)));
      all("[data-color-kind]").forEach((b)=>b.setAttribute("aria-pressed",String(draft[b.dataset.colorKind]===b.dataset.value)));
      all("[data-body]").forEach((b)=>b.setAttribute("aria-pressed",String(draft.body===b.dataset.body)));
      all("[data-preset]").forEach((b)=>b.setAttribute("aria-pressed",String(equal(draft,stateFrom(presets.find((p)=>p.id===b.dataset.preset))))));
      find("[data-hair-select]").value=draft.hair;
      find("[data-skin-id]").textContent=draft.skin==="legacyA"?"参考":draft.skin;
      find("[data-skin-label]").textContent=getSkin(draft)[1];
      find("[data-hair-id]").textContent=draft.color;
      find("[data-hair-label]").textContent=getColor(draft)[1];
      ["muscle","softness"].forEach((k)=>{find("[data-axis='"+k+"']").value=draft[k];find("[data-"+k+"-value]").textContent=String(draft[k]);});
      find("[data-action='undo']").disabled=undo.length===0;
      find("[data-action='redo']").disabled=redo.length===0;
      root.dataset.undoCount=String(undo.length);root.dataset.redoCount=String(redo.length);
      root.dataset.previewState=JSON.stringify(draft);
      root.dataset.startState=JSON.stringify(start);
    }
    function swatches(target,list,kind) {
      const parent=find(target);
      list.forEach((v)=>{
        const b=document.createElement("button");b.type="button";b.className="kc-swatch cursor-interaction";b.dataset.colorKind=kind;b.dataset.value=v[0];
        b.style.setProperty("--kc-swatch",v[2]);b.setAttribute("aria-label",v[0]+" "+v[1]);b.setAttribute("aria-pressed","false");
        const chip=document.createElement("span");chip.setAttribute("aria-hidden","true");b.append(chip,document.createTextNode(v[0]));
        b.addEventListener("click",()=>change(Object.assign({},draft,{[kind]:v[0]}),v[1]+"に変更しました。"));parent.append(b);
      });
    }
    swatches("[data-skin-swatches]",skins,"skin");swatches("[data-hair-swatches]",colors,"color");
    hairs.forEach((v)=>{const o=document.createElement("option");o.value=v[0];o.textContent=v[0]+" "+v[1];find("[data-hair-select]").append(o);});
    find("[data-hair-select]").addEventListener("change",(e)=>change(Object.assign({},draft,{hair:e.target.value}),"髪型を変更しました。"));
    presets.forEach((p)=>{
      const b=document.createElement("button");b.type="button";b.className="cursor-interaction";b.dataset.preset=p.id;b.setAttribute("aria-pressed","false");
      b.append(document.createTextNode(p.title));const sub=document.createElement("small");sub.textContent=p.note;b.append(sub);
      b.addEventListener("click",()=>change(stateFrom(p),p.title+"を選びました。"));find("[data-presets]").append(b);
    });
    bodies.forEach((b)=>{
      const el=document.createElement("button");el.type="button";el.className="cursor-interaction";el.dataset.body=b[0];el.textContent=b[1];el.setAttribute("aria-pressed","false");
      el.addEventListener("click",()=>change(Object.assign({},draft,{body:b[0],muscle:b[2],softness:b[3]}),b[1]+"に変更しました。"));find("[data-bodies]").append(el);
    });
    all("[data-tab]").forEach((b)=>{
      b.addEventListener("click",()=>{
        finishGesture();
        all("[data-tab]").forEach((t)=>t.setAttribute("aria-selected",String(t===b)));
        all("[role='tabpanel']").forEach((p)=>{p.hidden=p.id!==b.getAttribute("aria-controls");});
      });
      b.addEventListener("keydown",(e)=>{
        const tabs=all("[data-tab]"),i=tabs.indexOf(b);
        let next=e.key==="ArrowRight"?(i+1)%tabs.length:e.key==="ArrowLeft"?(i+tabs.length-1)%tabs.length:e.key==="Home"?0:e.key==="End"?tabs.length-1:null;
        if(next!==null){e.preventDefault();tabs[next].click();tabs[next].focus();}
      });
    });
    all("[data-axis]").forEach((el)=>{
      el.addEventListener("pointerdown",()=>{if(!gesture)gesture=copy(draft);pointerGesture=true;});
      el.addEventListener("input",()=>{
        const value=Number(el.value);
        if(!Number.isFinite(value)){el.value=String(draft[el.dataset.axis]);return;}
        if(!gesture)gesture=copy(draft);
        draft[el.dataset.axis]=Math.max(0,Math.min(100,value));comparison=false;sync();
      });
      el.addEventListener("change",()=>{
        const changed=gesture&&!equal(gesture,draft);
        finishGesture();if(changed)say("体型の調整を反映しました。");
      });
      el.addEventListener("blur",()=>{if(pointerGesture)cancelGesture();else finishGesture();});
      el.addEventListener("pointercancel",()=>cancelGesture());
    });
    let viewportWidth=window.innerWidth;
    window.addEventListener("resize",()=>{
      if(window.innerWidth!==viewportWidth){viewportWidth=window.innerWidth;cancelGesture();}
    });
    window.addEventListener("orientationchange",()=>cancelGesture());
    all("[data-compare]").forEach((b)=>b.addEventListener("click",()=>{finishGesture();comparison=b.dataset.compare==="before";sync();}));
    const randomChoice=(list,current)=>{const options=list.filter((v)=>v[0]!==current);return options[Math.floor(Math.random()*options.length)];};
    function showConfirm(mode) {
      finishGesture();comparison=false;confirmMode=mode;sync();
      find("[data-editor]").hidden=true;find("[data-confirm]").hidden=false;find("[data-history]").hidden=true;find("[data-bottom-actions]").hidden=true;
      find("[data-confirm-title]").textContent=mode==="cancel"?"変更を破棄しますか？":"この外見でよいですか？";
      find("[data-confirm-note]").textContent=mode==="cancel"?"編集開始時の外見へ戻ります。":"この見本内でのみ確定します。ゲームへの保存は行いません。";
      find("[data-action='accept']").textContent=mode==="cancel"?"変更を破棄":"この見本内で確定";
      find("[data-action='back']").textContent=mode==="cancel"?"編集を続ける":"編集へ戻る";
      const dl=find("[data-confirm-summary]");dl.replaceChildren();
      [["肌",getSkin(draft)[1]],["髪型",getHair(draft)[1]],["髪色",getColor(draft)[1]],["体型",getBody(draft)[1]+" / 筋肉 "+draft.muscle+"・柔らかさ "+draft.softness]].forEach((row)=>{
        const div=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=row[0];dd.textContent=row[1];div.append(dt,dd);dl.append(div);
      });
      find("[data-action='back']").focus();
    }
    function closeConfirm() {
      confirmMode=null;find("[data-confirm]").hidden=true;find("[data-editor]").hidden=false;find("[data-history]").hidden=false;find("[data-bottom-actions]").hidden=false;
    }
    all("[data-action]").forEach((b)=>b.addEventListener("click",()=>{
      const act=b.dataset.action;
      if(act==="random"){
        finishGesture();const next=copy(draft);let count=0;
        if(!find("[data-lock='skin']").checked){next.skin=randomChoice(skins,draft.skin)[0];count++;}
        if(!find("[data-lock='hair']").checked){next.hair=randomChoice(hairs,draft.hair)[0];next.color=randomChoice(colors,draft.color)[0];count++;}
        if(!find("[data-lock='body']").checked){const body=randomChoice(bodies,draft.body);next.body=body[0];next.muscle=body[2];next.softness=body[3];count++;}
        if(count)change(next,"固定していない"+count+"項目を変更しました。");else say("すべて固定されています。固定を外すと変更できます。");
      } else if(act==="undo"){finishGesture();if(undo.length){redo.push(copy(draft));draft=undo.pop();comparison=false;sync();say("1手戻しました。");}}
      else if(act==="redo"){finishGesture();if(redo.length){undo.push(copy(draft));draft=redo.pop();comparison=false;sync();say("やり直しました。");}}
      else if(act==="reset"){change(copy(start),"編集開始時の外見へ戻しました。");}
      else if(act==="review")showConfirm("commit");
      else if(act==="cancel"){finishGesture();if(!equal(draft,start))showConfirm("cancel");else say("変更はありません。編集開始時の外見です。");}
      else if(act==="back"){closeConfirm();find("[data-action='review']").focus();}
      else if(act==="accept"){
        if(confirmMode==="cancel"){draft=copy(start);say("変更を破棄し、編集開始時の外見へ戻しました。");}
        else {start=copy(draft);say("この見本内で確定しました。ページを閉じると初期状態に戻ります。");}
        undo=[];redo=[];gesture=null;pointerGesture=false;comparison=false;closeConfirm();sync();find("[data-action='review']").focus();
      }
    }));
    root.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&confirmMode){e.preventDefault();closeConfirm();find("[data-action='review']").focus();}});
    root.dataset.ready="true";sync();
  })();
  </script>
</div>
