<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orzelion Storm GPU</title><style>body{background:#111c26;color:#dbe8f5;font:15px system-ui;margin:0}main{max-width:1200px;padding:12px;margin:auto}h1{font-size:22px}#scene{width:100%;height:55vh;min-height:240px;border:1px solid #52697e;touch-action:none}canvas{display:block}fieldset{border:1px solid #52697e;border-radius:6px;margin-top:10px}label{display:inline-block;margin:6px}button,select{background:#243649;color:white;padding:8px;border:1px solid #718ba2;border-radius:6px}input[type=range]{width:100%}.note{color:#a7b8c6;font-size:12px}</style><main><h1>ORZELION / STORM V3 GPU</h1><p class="note">開発サーバー用。PBR、GPUスキニング、雷ブルーム、筋肉・膜モーフの検証。ゲーム本体未統合。</p><div id="scene"></div><p id="status">読み込み中</p><fieldset><label>動作 <select id="clip"></select></label><button id="play">停止</button><label>品質 <select id="quality"><option value="1">低</option><option value="2" selected>標準</option><option value="3">高</option></select></label><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option selected value="1">1×</option></select></label><label><input id="debug" type="checkbox">判定境界</label><input id="seek" type="range" min="0" max="10" step=".01666667" value="0"><output id="time"></output></fieldset></main><script type="module" src="./studio_gpu.mjs"></script></html>
