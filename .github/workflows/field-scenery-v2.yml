name: Field scenery V2 verification
on:
  pull_request:
    branches: ['main']
    paths:
      - 'src/render/fieldLandscape.ts'
      - 'src/render/sceneryAssets.ts'
      - 'tools/landscape-shots.mjs'
      - '.github/workflows/field-scenery-v2.yml'
permissions:
  contents: read
jobs:
  scenery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: SCENERY_ALL=1 node tools/landscape-shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-scenery-v2-all-regions
          path: tools/out/landscape/
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-scenery-v2-smoke
          path: tools/out/
