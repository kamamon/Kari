name: Field landscape browser check
on:
  pull_request:
    branches: ['main']
    paths:
      - 'src/render/fieldLandscape.ts'
      - 'src/render/arena.ts'
      - 'src/render/view.ts'
      - 'tools/landscape-shots.mjs'
      - '.github/workflows/field-landscape-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/landscape-shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-landscape-shots
          path: tools/out/landscape/
